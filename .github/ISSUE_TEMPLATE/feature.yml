name: Feature request
description: Suggest a change to how the product works.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered or use today.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I searched existing issues and I am not posting unverified AI-generated output
          required: true
